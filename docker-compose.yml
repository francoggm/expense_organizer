version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expense_organizer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_organizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_organizer_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - expense_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_organizer_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
      - "10.118.112.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - expense_network

networks:
  expense_network:
    driver: bridge

volumes:
  postgres_data:
